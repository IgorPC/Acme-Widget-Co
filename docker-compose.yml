services:
  backend:
    build: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "set -e;
             if [ ! -f vendor/autoload.php ]; then composer setup --no-interaction; else echo 'vendor found, skipping composer install'; fi;
             if [ ! -f .env ]; then cp .env.example .env && php artisan key:generate; fi;
             php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://backend:8000
      VITE_USE_POLLING: "true"
    command: >
      sh -c "set -e;
             if [ ! -d node_modules/.bin ]; then npm install; else echo 'node_modules found, skipping npm install'; fi;
             npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
